# Adapted throughput protocol, not the unchanged paper training recipe.
recipe: TrainEagle3Recipe
dist_env:
  backend: nccl
  timeout_minutes: 15
recipe_args:
  target_model_name_or_path: __MODEL__
  train_data_path: __DATA__
  val_data_path: null
  output_dir: __OUT__
  seq_length: 2048
  micro_batch_size: 1
  grad_accumulation_steps: 2
  num_workers: 0
  num_epochs: 1
  ttt_steps: 7
  draft_vocab_size: 32000
  freeze_embeddings: true
  draft_gradient_checkpointing: false
  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 0.5
  target_force_hf: true
  target_attn_implementation: eager
  draft_attn_implementation: __ATTN__
  packed_sequence_size: __PACK__
  target_prefetch_depth: 0
optimizer:
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.0
  min_lr_ratio: 1.0
checkpoint:
  enabled: false
